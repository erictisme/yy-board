<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Board</title>
<style>
:root{--bg:#F5F7F8;--fg:#1B2328;--muted:#5C6870;--line:#DDE3E6;--accent:#22607A;--card:#fff;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12171A;--fg:#E7ECEE;--muted:#9AA7AE;--line:#2B353B;--accent:#7FC0DA;--card:#1A2125;--btnfg:#0D1A20;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px;width:min(360px,100%)}
input[type=password]{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--fg)}
button{padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--btnfg);font:inherit;font-weight:600;cursor:pointer}
label.rm{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
#err{color:#b3261e;font-size:.9rem;min-height:1.2em;margin:0}
</style></head><body>
<div class="gate" id="gate"><form id="f"><strong>Password</strong>
<input id="pw" type="password" autocomplete="current-password" autofocus aria-label="Password">
<label class="rm"><input type="checkbox" id="rm"> Remember on this device</label>
<button type="submit">Open</button><p id="err"></p></form></div>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='Opening...';const pw=document.getElementById('pw').value,keep=document.getElementById('rm').checked;
  try{await open_(pw);try{if(keep)localStorage.setItem('bpw',pw)}catch(_){}}
  catch(_){err.textContent='Wrong password. Check with Eric.'}});
(async()=>{let s=null;try{s=localStorage.getItem('bpw')}catch(_){}
  if(s){try{await open_(s)}catch(_){try{localStorage.removeItem('bpw')}catch(__){}}}})();
